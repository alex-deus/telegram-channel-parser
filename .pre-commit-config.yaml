repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
    -   id: ruff
        args: ['--fix']
    -   id: ruff-format
-   repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
    -   id: bandit
        args: ['-f', 'html', '-o', 'bandit-report.html', '-r', '.']
