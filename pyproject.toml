[tool.poetry]
name = "telegram-channel-parser"
version = "1.0.0"
description = "Parser of Telegram channel"
authors = []

[tool.poetry.dependencies]
python = "^3.12.1"
telethon = "^1.42.0"
click = "^8.3.1"
pydantic-settings = "^2.12.0"
coloredlogs = "^15.0.1"
python-slugify = "^8.0.4"
tenacity = "^9.1.4"
boto3 = "^1.37.0"
poethepoet = "^0.46.0"

[tool.poetry.group.dev.dependencies]
parameterized = "^0.8.1"
pre-commit = "^2.10.1"
bandit = "^1.7.0"
ruff = "^0.9.0"

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format --check"

[tool.ruff]
line-length = 120
exclude = [".git", "tmp/", "data/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
